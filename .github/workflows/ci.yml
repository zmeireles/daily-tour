# Daily Tour — Continuous Integration
#
# Runs lint, typecheck, test, and build for every PR (against the affected
# turbo subgraph) and for every push to main (full graph). No write
# permissions; no secrets — safe to run on forks.
#
# Hard secret-scan gate, pnpm audit, and CodeQL live in security.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # turbo's affected-graph filter (--filter=...[origin/main]) needs the
          # base ref reachable from HEAD. fetch-depth: 0 fetches full history;
          # for a small monorepo this is <1s on GitHub-hosted runners. A
          # shallow clone errors with "unknown revision 'origin/main'" because
          # the ref isn't materialised.
          fetch-depth: 0

      # Activate pnpm via the packageManager field BEFORE setup-node so that
      # setup-node's `cache: pnpm` step can resolve the pnpm store path.
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.14.2 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On PRs, scope the turbo graph to packages affected by the PR diff
      # vs origin/main. On push-to-main, run the full graph (no filter).
      - name: i18n key parity + callsite resolution
        run: pnpm --filter @daily-tour/pwa check:i18n

      - name: Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run lint --filter=...[origin/main]
          else
            pnpm exec turbo run lint
          fi

      - name: Typecheck
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run typecheck --filter=...[origin/main]
          else
            pnpm exec turbo run typecheck
          fi

      - name: Test
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run test --filter=...[origin/main]
          else
            pnpm exec turbo run test
          fi

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run build --filter=...[origin/main]
          else
            pnpm exec turbo run build
          fi

      - name: Upload Turborepo run summary
        if: success() && hashFiles('.turbo/runs/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs-${{ github.run_id }}
          path: .turbo/runs
          retention-days: 7
          if-no-files-found: ignore

  # The layout axis, which the unit suite structurally cannot cover: jsdom
  # loads no CSS and does no layout, so it can assert accessible names and
  # class strings and nothing else. Two shipped defects came through that gap
  # (#382, #405) — both "a guest cannot reach their own language because its
  # button is off-screen" — and reviewing #400 measured the gap directly: a
  # mutation deleting the responsive label pair, which overflows WORSE than the
  # original bug, passed all seven of that PR's new tests. It fails 7 of the 15
  # specs here. (#406)
  #
  # A separate job so the browser download never slows the main quality gate.
  # No backend: the guest session is established by stubbing the token exchange,
  # because layout needs the right components mounted, not real data.
  e2e:
    name: E2E (layout / overflow)
    runs-on: ubuntu-24.04
    # 20, not 15: the install step may now burn up to 12 minutes across two
    # bounded attempts before giving up, and the old 15 left no room for the
    # build and specs after a first-attempt stall.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.14.2 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the browser binary (~113 MB) on the Playwright version, so a
      # dependency bump invalidates it and nothing else does.
      # From the repo root `require('@playwright/test/package.json')` THROWS:
      # the dependency belongs to apps/pwa and pnpm's node_modules is isolated.
      # The command substitution swallowed the error and `echo` still exited 0,
      # so this wrote `version=` and the cache key below has been the constant
      # `playwright-Linux-` — a browser cache invalidated by nothing, least of
      # all the version bump it exists to catch. Measured on run 32230362122
      # and reproduced locally. Resolve from the workspace that owns the
      # dependency, and refuse to cache on a blank key rather than write one
      # silently.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(node -p "require(require.resolve('@playwright/test/package.json',{paths:['apps/pwa']})).version")
          if [ -z "$version" ]; then
            echo "::error::could not resolve the Playwright version — refusing to cache on a blank key"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved Playwright $version"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # apt is the whole problem, and it is not ours. The runner's mirrorlist
      # puts http://azure.archive.ubuntu.com first, every index off that host is
      # Ign'd, and after falling back to archive.ubuntu.com apt goes SILENT
      # mid-acquire: 4m21s of nothing, twice in a row, on runs 32230362122 and
      # 32235692022. `--with-deps` shells out to it on EVERY run, cache hit or
      # not — so a required check is hostage to a mirror we do not own, and a
      # retry cannot help when both attempts hang the same way.
      #
      # So install the browser WITHOUT apt and then prove it can actually
      # launch. The runner image ships Chrome and its shared libraries, so the
      # dependencies are normally already there — but "normally" is not a gate,
      # which is why the launch decides rather than an assumption, and only a
      # genuine miss pays for apt.
      #
      # The launch check is a real check, verified in both directions: it
      # succeeds against an installed browser and exits 1 with "Executable
      # doesn't exist" when the browser directory is empty.
      - name: Install Chromium
        timeout-minutes: 12
        run: |
          set -euo pipefail
          pnpm --filter @daily-tour/pwa exec playwright install chromium
          if (cd apps/pwa && node -e 'const {chromium}=require("@playwright/test"); chromium.launch().then(b=>b.close()).then(()=>process.exit(0),e=>{console.error(e.message.split("\n")[0]);process.exit(1)})'); then
            echo "chromium launches — system dependencies already present, apt not needed"
            exit 0
          fi
          echo "::warning::chromium could not launch — falling back to apt for system dependencies"
          # Only reached when the image genuinely lacks a library. Bound each
          # attempt, and reap between them: `timeout` kills pnpm, never the
          # apt-get three levels under it, and that orphan keeps
          # /var/lib/apt/lists/lock — which is why the previous retry died
          # eleven seconds in with "Could not get lock ... held by process
          # 2489" instead of getting a second real try.
          reap_apt() {
            sudo pkill -TERM -x apt-get 2>/dev/null || true
            for _ in $(seq 1 24); do
              pgrep -x "apt-get|dpkg" >/dev/null || return 0
              sleep 5
            done
            sudo pkill -KILL -x apt-get 2>/dev/null || true
            echo "::warning::apt still running after two minutes — killed it"
          }
          for attempt in 1 2; do
            if timeout 300 pnpm --filter @daily-tour/pwa exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::apt install stalled or failed (attempt $attempt of 2) — retrying"
            reap_apt
          done
          echo "::error::chromium could not launch and apt failed twice; see the output above"
          exit 1

      # playwright.config.ts starts `pnpm preview` itself, which serves dist —
      # so the bundle has to exist first. This is the built artefact, not the
      # dev server: the defects being guarded are CSS-at-real-widths defects.
      # Through turbo, not `pnpm --filter`: the PWA imports @daily-tour/shared-types,
      # and a direct filtered build skips turbo's dependency ordering, so `tsc`
      # fails with "Cannot find module '@daily-tour/shared-types'" on a clean
      # checkout. It passed locally only because that package's dist/ was already
      # on disk from an earlier build — the CI runner is the honest environment.
      - name: Build the PWA (and its workspace deps)
        run: pnpm exec turbo run build --filter=@daily-tour/pwa

      - name: Run layout specs
        run: pnpm --filter @daily-tour/pwa exec playwright test e2e/layout-overflow.spec.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/pwa/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Python services are NOT in the turbo graph (no package.json), so the
  # `quality` job above never touched them — the Plan-001 accounting retro's
  # root cause (false-resolves shipped because CI never exercised chat-hub /
  # planner-svc / search-svc). This matrix runs each package's own gate
  # (ruff + mypy --strict + pytest) on every PR. Suites are tiny, so every
  # entry runs unconditionally rather than path-scoped.
  #
  # `packages/python-common` is in this matrix for the same reason the four
  # services are: it is Python, so `quality` cannot see it either — and it is
  # the ONLY entry whose code every service imports at runtime. It sat
  # uncovered until 2026-08-26.
  #
  # ⚠️ The `name:` below is written out explicitly, and the matrix key stays a
  # bare package name, because the `protect-main` ruleset pins these check
  # names verbatim ("Python (ruff + mypy + pytest) (chat-hub)", …). A matrix
  # keyed on the PATH would rename all four; the required checks would then
  # never report and every PR would block. Directory lives in `dir`, which the
  # explicit `name:` keeps out of the check name.
  python:
    name: Python (ruff + mypy + pytest) (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: chat-hub
            dir: services/chat-hub
          - package: notif-svc
            dir: services/notif-svc
          - package: planner-svc
            dir: services/planner-svc
          - package: search-svc
            dir: services/search-svc
          - package: python-common
            dir: packages/python-common
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.dir }}/uv.lock"

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q
