name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/pwa/**"

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Perf Budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.14.2 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Use turbo to build the PWA AND its workspace deps (shared-types,
      # shared-config, etc.) in dep-graph order. The direct
      # `pnpm --filter @daily-tour/pwa build` form skips deps and fails
      # with `Cannot find module '@daily-tour/shared-types'` because the
      # PWA's tsc step needs the dep's .d.ts files emitted first. Mirrors
      # the build step in ci.yml.
      - name: Build PWA (with deps)
        run: pnpm exec turbo run build --filter=@daily-tour/pwa

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis-${{ github.run_id }}
          path: apps/pwa/dist/stats.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Run Lighthouse CI
        run: pnpm --filter @daily-tour/pwa lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
