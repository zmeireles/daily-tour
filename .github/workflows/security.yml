# Daily Tour — Security Workflow
#
# Hard gates for every PR + push to main, plus a weekly scheduled sweep:
#   - gitleaks: secret scan. gitleaks-action auto-discovers `.gitleaks.toml`
#     at the repo root, which is GENERATED — see scripts/dev/sync-gitleaks-config.sh.
#     Editing it by hand is overwritten on the next sync; edit the inputs.
#   - pnpm-audit: production dep audit, fail on high+
#   - codeql: static analysis for JavaScript/TypeScript
#
# TODO(T-2.0.x): add 'python' to the CodeQL language list once
#                services/search-svc lands.
# TODO(T-0.4.4): add a trivy job for Docker image scanning once the
#                bff/pwa images are first published.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly sweep — Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  # On demand, and this is load-bearing rather than a convenience. gitleaks-action
  # scans ONLY the pushed commits on a `push` event and the WHOLE history on
  # schedule/dispatch, so the two answer different questions — which is how the
  # weekly run stayed red for five weeks (2026-07-20 … 08-17) while every push
  # run passed. Without a dispatch trigger, a fix to that gate could not be
  # verified without waiting a week (#415).
  workflow_dispatch:

permissions:
  contents: read
  # security-events is only needed for the CodeQL SARIF upload below; the
  # other jobs run with the workflow-level read perms.
  security-events: write

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the entire git log on push/schedule.
          fetch-depth: 0

      # gitleaks-action@v2 auto-discovers .gitleaks.toml at the repo root.
      # For public OSS repos no license is required; for private repos set
      # GITLEAKS_LICENSE as a secret. We deliberately do NOT pass secrets
      # here so the workflow runs on forks; private-repo setup is documented
      # in docs/exploration/04-tech-stack.md §4.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pnpm-audit:
    name: pnpm audit (prod deps, high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.14.2 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # The dev graph is gated too (#371). It was ungated for a long time and
      # accumulated 23 high plus one critical (vitest <3.2.6, CVSS 9.8) that
      # nobody saw, because --prod skips it entirely. A build-and-test toolchain
      # is code that runs on developer machines and on this runner with a
      # checkout of the repository; "not shipped" is not "not exposed".
      #
      # Kept as a SEPARATE step from the prod audit on purpose: when this one
      # goes red it must be obvious that production is unaffected, so the
      # response can be proportionate instead of alarmed.
      # The FULL graph is audited deliberately. `pnpm audit --dev` exists and
      # does filter (measured on this tree: prod 3, dev 11, full 12 — the
      # overlap is advisories present in both graphs), but a full-graph gate is
      # strictly stronger, and being a superset of the prod step is exactly the
      # property that makes the sequential pair in lefthook.yml sound.
      #
      # Legible because the prod step runs first: if that passed and this fails,
      # the advisory is dev-only and production is unaffected.
      - name: Audit full dependency graph (dev + prod)
        run: pnpm audit --audit-level=high

  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # TODO(T-2.0.x): add 'python' once services/search-svc lands.
        language: ["javascript-typescript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
