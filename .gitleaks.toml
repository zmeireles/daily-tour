# ============================================================================
# Daily Tour — gitleaks ENTRYPOINT (Class-B extension: allowlists ONLY).
# ----------------------------------------------------------------------------
# Rules (incl. the daily-tour `dt_` reservation-token rule) live in the central
# single-source config; this file holds ONLY project-specific FP allowlists.
# SoT Fase 1 P0 gitleaks centralization.
#
# Why this file is named `.gitleaks.toml` and not `-ext`: it is what BOTH
# consumers point at — the lefthook pre-commit hook and the `security` CI
# workflow — and the root name is also what gitleaks AUTO-DETECTS, so a consumer
# that forgets `--config` still gets the real ruleset instead of silently falling
# back to bare defaults.
#
# ⚠ That silent fallback is not hypothetical; it is #415. There was no root
# `.gitleaks.toml`, so CI auto-detection found nothing and scanned on defaults
# with NO allowlist. Push events scan only the pushed commits, so the waived
# findings never appeared in a diff and every push run was green — while the
# scheduled full-history run was RED for five consecutive weeks (2026-07-20 …
# 08-17) before anyone read it. A gate that is always red carries no signal on
# the day something real lands.
#
# ⚠ CI RUNS ON A DIFFERENT MACHINE. It has no ~/.claude/config, so an absolute
# home path in [extend] is unreachable there. The central ruleset is therefore
# VENDORED at `.gitleaks/central.toml` and the extend path is REPO-RELATIVE, so
# the same chain resolves identically for the hook, for CI, and for a fresh
# clone. Same arrangement as nexumpro-marketplace, which hit this first.
#
# ⚠ The former whole-tree `docs/.*` and whole `.github/workflows/.*` waivers were
# NARROWED to value-scoped allowlists (below) so a future real secret added to
# those paths is NOT silently masked (the INC-016 anti-pattern).
# ============================================================================

title = "daily-tour-ext"

[extend]
# Repo-relative → portable. `.gitleaks/central.toml` is a VERBATIM, byte-identical
# copy of the platform SoT config (~/.claude/config/gitleaks.toml). Never
# hand-edit the vendored copy: universal rules belong upstream, project
# allowlists belong in this file. The lefthook `gitleaks-central-in-sync` job
# fails loudly when the copy drifts, so a stale vendored ruleset cannot go
# unnoticed on a machine that has the original.
path = ".gitleaks/central.toml"

[allowlist]
description = "Daily Tour project FPs (paths for generated/placeholder files; value-scoped doc + CI test literals)"
regexTarget = "match"
paths = [
  # Generated / lockfile / snapshot noise.
  "pnpm-lock.yaml",
  ".*\\.snap$",
  # Placeholder-only template (real values sourced from ~/.secrets).
  "\\.mcp\\.json\\.template$",
]
regexes = [
  # Doc/template placeholders like <YOUR_API_KEY_HERE>.
  '''<[A-Z_]+>''',
  # NARROWED from `docs/.*`: a dev-stack multi-use reservation REDEEM token for
  # TEST reservation ccc…002 (docs/ai/session-handoff.md), used for browser-uat.
  # Dev-only test data flagged by generic-api-key entropy — not a production
  # credential. Value-scoped so it can NOT mask a future secret in that doc.
  '''YI3yn18QsI4jGxF6yxGswb7v4BXLC-Ik''',
  # NARROWED from `.github/workflows/.*`: CI-only literal test secrets in
  # load-test.yml — never used outside the runner. Value-scoped, not whole-file.
  '''ci-test-jwt-signing-key''',
  '''ci_pg_pass''',
  # ──────────────────────────────────────────────────────────────────────────
  # Surfaced by #415, when CI stopped scanning with NO config and the central
  # rules (postgres-password-assignment, telegram-bot-api-token) applied here
  # for the first time. All five are placeholders, shell syntax, or throwaway
  # values — each inspected in the tree before being waived, and each scoped to
  # its exact value so a REAL password in the same file still fires.
  # ──────────────────────────────────────────────────────────────────────────
  # ⚠️ Each of the five below writes the variable name as `POSTGRES[_]PASSWORD`.
  # As a regex that is identical to `POSTGRES_PASSWORD`, so it still allowlists
  # the real finding — but the literal string the RULE looks for is no longer
  # present in this file, so the rule stops firing on the allowlist that exists
  # to silence it. (It did: the pre-commit hook rejected this very commit with
  # four findings in this file.) The alternative was a whole-file waiver on the
  # gitleaks configs, which would mask a real secret pasted into them.
  # `.env.example` — the literal placeholder the file exists to hand out.
  '''POSTGRES[_]PASSWORD=change-me-please-postgres''',
  # `.env.qual.example` — sentinel replaced at provision time.
  '''POSTGRES[_]PASSWORD=__GENERATED__''',
  # `infra/compose/docker-compose.base.yml` — compose's error-if-unset
  # expansion: the variable name, then `:?`, then an error message. There is no
  # value in it at all; the rule matches the variable name twice over the `:?`.
  '''POSTGRES[_]PASSWORD:\?POSTGRES[_]PASSWORD''',
  # `scripts/ops/restore-drill-postgres.sh` — password for the ephemeral
  # container the restore drill creates and destroys. Anchored with `$` to the
  # complete value, so the same variable set to `drill` plus anything further
  # is NOT covered by this waiver.
  '''POSTGRES[_]PASSWORD=drill$''',
  # `services/chat-hub/tests/test_telegram_driver.py` — aiogram validates token
  # SHAPE on construction, so the test needs a well-formed one. Self-describing
  # fake, value-scoped rather than waiving the tests directory.
  '''123456789:AAHfakeTokenForTestingPurposes01234''',
  # ──────────────────────────────────────────────────────────────────────────
  # #423 — NARROWED from three whole-file `infra/` path waivers.
  # Measured with CI's gitleaks (8.24.3, via the pinned container — the
  # workstation's build is a different version and finds NOTHING here, so a
  # local green proves nothing): across all three paths the runner raises
  # exactly ONE finding, the line below. The other two paths
  # (`infra/traefik/dashboard-users`, `infra/authentik/blueprints/*.yaml`)
  # raise none at all, in the working tree or anywhere in history — so their
  # waivers silenced nothing and are simply gone. A path waiver that suppresses
  # no real finding is pure blind spot: an AWS-shaped key planted in each of the
  # three was detected 0/3 with them and 3/3 without.
  #
  # The `dailytour` broker user's DEV password hash. Not the qual credential:
  # RabbitMQ ignores RABBITMQ_DEFAULT_USER when `load_definitions` is set, so
  # `deploy-qa.yml` reconciles the real password post-`up` with
  # `rabbitmqctl change_password` (#228, Plan-007 EXECUTION row 4). Value-scoped,
  # so a REAL secret added anywhere in that file still fires.
  '''G/XQ27SDPoHr9aEWF7UJ54ZzAFLfJXTDit1pWjTmM234GWWe''',
]
