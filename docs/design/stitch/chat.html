    <script>
      // Lightweight atmospheric effect for the pull-up sheet
      const sheet = document.querySelector("section");
      let startY = 0;

      sheet.addEventListener("touchstart", (e) => {
        startY = e.touches[0].clientY;
      });

      sheet.addEventListener("touchmove", (e) => {
        const currentY = e.touches[0].clientY;
        const diff = startY - currentY;
        if (diff > 50) {
          sheet.style.transform = `translateY(-10px)`;
          sheet.style.transition = "transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)";
        } else if (diff < -50) {
          sheet.style.transform = `translateY(0)`;
        }
      });

      // Re-center on pins click simulation
      document.querySelectorAll('button[class*="absolute top"]').forEach((btn) => {
        btn.addEventListener("click", () => {
          // Pulse effect
          btn.classList.add("animate-ping");
          setTimeout(() => btn.classList.remove("animate-ping"), 500);
        });
      });
    </script>

</html>
