# Daily Tour — owner-app OIDC blueprint (T-1.6.0).
#
# Versioned source of truth for the Authentik realm config that the BFF
# verifies against (RS256 + JWKS, aud=`staff`). Manual changes in the
# Authentik UI WILL drift from this file — re-export via `ak export
# blueprint <pk>` from the worker container after any UI edit, or update
# this file by hand and let Authentik upsert via identifiers.
#
# Apply path: docker-compose.authentik.yml mounts this directory at
# /blueprints/custom inside the server + worker; the worker picks it up
# automatically on boot (or via "Apply" in the admin UI > Customization >
# Blueprints). Auto-apply on Authentik 2026.2.2 has been observed to fail
# silently with no error column / no traceback in the worker logs (see
# infra/README.md "Authentik on first boot"); if `BlueprintInstance.status`
# is `error` after a restart, copy the entries below into the admin UI by
# hand as a one-shot fallback.
#
# Secret hygiene: AUTHENTIK_OWNER_APP_CLIENT_SECRET is read via !Env at
# apply time — the literal secret never lives in this file. The matching
# .env.example placeholder is in the Authentik section.

version: 1
metadata:
  name: daily-tour - owner-app OIDC provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Group: `staff`. Members of this group get the `groups: ["staff"]` claim
  # in their JWT, which the BFF's owner-auth plugin checks against
  # AUTHENTIK_OWNER_AUDIENCE (default "staff") to authorise backoffice
  # access. Phase 5 may split owner vs admin; for v1 a single tier.
  - model: authentik_core.group
    identifiers:
      name: staff
    attrs:
      is_superuser: false
      attributes:
        description: Daily Tour owners and admins — owner backoffice access.

  # Scope mapping: emits `groups` in the access/ID token so the BFF can
  # check membership without a userinfo round-trip. The default Authentik
  # `openid`/`email`/`profile` mappings handle the standard claims; this
  # one adds `groups` as an array of group names.
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-groups-dailytour
    attrs:
      name: "Daily Tour — groups claim"
      scope_name: groups
      description: Emits a `groups` array of group names on the access/ID token.
      expression: |
        return {
          "groups": [group.name for group in request.user.ak_groups.all()],
        }

  # OIDC provider. Confidential client (BFF holds the secret; PWA does
  # PKCE-only against the public client surface). Tokens are RS256 — the
  # signing key is Authentik's default self-signed cert; Phase 5 swaps
  # this for a Let's Encrypt or HSM-backed key.
  #
  # Token lifetimes: access 1 hour, refresh 14 days — matches D7
  # (refresh policy) in docs/REQUIREMENTS.md.
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: owner-app-oidc
    attrs:
      client_type: confidential
      client_id: owner-app
      client_secret: !Env AUTHENTIK_OWNER_APP_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: hours=1
      refresh_token_validity: days=14
      include_claims_in_id_token: true
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      # Dev (Vite default port) + QA redirect URIs. Phase 5 deploy
      # injects the production URL via a per-environment override
      # blueprint or via the Authentik API.
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:5173/admin/callback
        - matching_mode: strict
          url: http://owner.dt.localhost:27080/admin/callback
        - matching_mode: strict
          url: https://qa.dailytour.example/admin/callback
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, "goauthentik.io/providers/oauth2/scope-openid"],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, "goauthentik.io/providers/oauth2/scope-email"],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, "goauthentik.io/providers/oauth2/scope-profile"],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, "goauthentik.io/providers/oauth2/scope-groups-dailytour"],
          ]

  # Application: the user-facing entry. `slug: owner-app` is what
  # surfaces in JWKS/OIDC URLs (e.g. /application/o/owner-app/jwks/).
  # `policy_engine_mode: any` means a single matching policy grants
  # access; we bind the staff-group policy below.
  - model: authentik_core.application
    identifiers:
      slug: owner-app
    attrs:
      name: Daily Tour — Owner Backoffice
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, owner-app-oidc]]
      policy_engine_mode: any
      meta_launch_url: http://owner.dt.localhost:27080/admin
      meta_description: Owner backoffice for managing places, candidates, and approvals.
      meta_publisher: Daily Tour

  # Policy: only members of `staff` may launch the app / mint tokens.
  # Without this, any authenticated Authentik user could obtain an
  # owner-app token (signature would verify but BFF would 403 on the
  # group check — defence in depth).
  - model: authentik_policies_expression.expressionpolicy
    identifiers:
      name: staff-only-policy
    attrs:
      execution_logging: false
      expression: |
        return ak_is_group_member(request.user, name="staff")

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, owner-app]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, staff-only-policy]]
      enabled: true
      negate: false
