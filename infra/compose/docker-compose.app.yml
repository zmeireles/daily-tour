# Daily Tour — application overlay (BFF + token-svc + catalog-svc + static PWA)
#
# Four services that round out the request path: PWA → Traefik → BFF →
# {token-svc, catalog-svc} (+ Postgres + Redis on dt_internal from the base
# overlay).
#
#   - bff           → built locally from services/bff/Dockerfile (multi-stage,
#                     ~216 MB). Listens on :8080. Reached as http://api.${TRAEFIK_DOMAIN_BASE:-dt.localhost}
#                     via Traefik. CORS already echoes the request origin (see
#                     services/bff/src/app.ts), so app.${TRAEFIK_DOMAIN_BASE:-dt.localhost} → api.${TRAEFIK_DOMAIN_BASE:-dt.localhost}
#                     fetches work in the browser. Reaches token-svc directly via
#                     dt_internal (http://dt_token_svc:8088) — no Traefik leg.
#   - token-svc     → built from services/token-svc/Dockerfile (multi-stage,
#                     ~227 MB). Listens on :8088. **Internal-only** — no host
#                     port binding, no Traefik labels. The BFF is the only
#                     consumer in Phase 1; T-1.6.x may add Traefik for owner-side
#                     reservation CRUD.
#   - pwa-static    → nginx:1.27-alpine serving the pre-built apps/pwa/dist via
#                     a read-only bind mount. SPA fallback to index.html so the
#                     React router handles unknown routes. Reached as
#                     http://app.${TRAEFIK_DOMAIN_BASE:-dt.localhost} via Traefik. Run
#                     `pnpm --filter @daily-tour/pwa build` BEFORE bringing this
#                     overlay up — the bind mount has no inline build step.
#
# Compose on top of the base + Traefik (+ Authentik + n8n) overlays:
#   docker compose \
#     --env-file dev-environment \
#     -f infra/compose/docker-compose.base.yml \
#     -f infra/compose/docker-compose.traefik.yml \
#     -f infra/compose/docker-compose.authentik.yml \
#     -f infra/compose/docker-compose.n8n.yml \
#     -f infra/compose/docker-compose.app.yml \
#     up -d --build
#
# `--build` is required because the BFF service has a `build:` block and we
# want source changes picked up on `up`. For hot-reload feature work, prefer
# native `pnpm dev` (Vite + tsx watch) and skip this overlay — see
# infra/README.md "Dev flows".

name: dailytour-base

networks:
  dt_internal:
    external: true
    name: dt_internal

services:
  # ─────────────────────────────────────────────────────────────────────────
  # OTel Collector — receives OTLP/HTTP traces from Python services (port 4318)
  # and forwards them downstream (debug exporter for dev; swap in Tempo/Alloy
  # for staging/prod). Python services do NOT depend_on this — span export
  # failures are silent; the collector can restart independently.
  # ─────────────────────────────────────────────────────────────────────────
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.125.0
    container_name: dt_otel_collector
    restart: unless-stopped
    networks:
      - dt_internal
    volumes:
      - ../observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ─────────────────────────────────────────────────────────────────────────
  # BFF — Fastify v5.8.5 backend-for-frontend (T-0.4.2)
  # Single ingress for the PWA. Built from the repo root because the
  # Dockerfile copies workspace files (pnpm-workspace.yaml, packages/*).
  # ─────────────────────────────────────────────────────────────────────────
  bff:
    build:
      context: ../..
      dockerfile: services/bff/Dockerfile
    image: daily-tour/bff:dev
    container_name: dt_bff
    restart: unless-stopped
    networks:
      - dt_internal
    # Bound to 127.0.0.1 so the host-side PWA (vite dev server on :5173) can
    # proxy /r/ + /v1/ + WebSocket /v1/chat/ws to the bff. Production routes
    # via Traefik (docker-compose.traefik.yml) and can keep bff internal-only.
    ports:
      - "127.0.0.1:${DT_HOST_PORT_BFF:-28080}:8080"
    depends_on:
      token-svc:
        condition: service_healthy
      media-svc:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "8080"
      HOST: 0.0.0.0
      # OTel collector wiring lands in T-0.5.x / Phase 5 — leave the endpoint
      # empty so the SDK no-ops instead of crashing on connect refused.
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: bff
      # T-1.0.2 auth wiring: BFF calls token-svc and reads/writes the JTI
      # revocation cache in Redis.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY missing in .env}
      TOKEN_SVC_URL: http://dt_token_svc:8088
      REDIS_URL: redis://default:${REDIS_PASSWORD}@dt_redis:6379/0
      # T-1.4.0 media-svc: BFF forwards X-Internal-Token for owner-upload signing.
      MEDIA_SVC_URL: http://dt_media_svc:8087
      CATALOG_SVC_INTERNAL_TOKEN: ${CATALOG_SVC_INTERNAL_TOKEN:?CATALOG_SVC_INTERNAL_TOKEN missing in .env}
      MEDIA_SVC_INTERNAL_TOKEN: ${MEDIA_SVC_INTERNAL_TOKEN:?MEDIA_SVC_INTERNAL_TOKEN missing in .env}
      # Analytics writes (T-3.4.1) — the bff role's INSERT into analytics.tour_event.
      # Built from SERVICE_DB_PASSWORD_BFF so rotated envs (qual) authenticate; the
      # dev placeholder keeps dev byte-for-byte (config.ts has the same default).
      ANALYTICS_DATABASE_URL: postgres://bff:${SERVICE_DB_PASSWORD_BFF:-change-me-please-bff}@dt_postgres:5432/dailytour
      # T-8.3.5 translate helper: BFF calls Anthropic for owner-facing PT-PT/ES
      # translation. Blank in dev/CI — the route returns 503 when the key is
      # unset (mirrors planner-svc / chat-hub posture).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # T-8.5.1 map picker: BFF proxies Geoapify geocoding (key hidden
      # server-side). Blank in dev/CI — both /v1/admin/geocode routes return 503
      # when unset and the picker degrades to numeric lat/lng inputs.
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
    healthcheck:
      # node:22-alpine ships BusyBox wget at /usr/bin/wget; -q --spider works.
      # Use 127.0.0.1 explicitly — container /etc/hosts resolves "localhost" to
      # both 127.0.0.1 AND ::1, BusyBox wget prefers IPv6, and Fastify only
      # listens on 0.0.0.0 (IPv4). "localhost" → connection refused.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bff.rule=Host(`api.${TRAEFIK_DOMAIN_BASE:-dt.localhost}`)"
      - "traefik.http.routers.bff.entrypoints=web"
      - "traefik.http.routers.bff.service=bff"
      # Reject floods at the edge, in Go, before they cost the bff any CPU.
      # Measured (#435): under a single-source flood the bff is CPU-throttled in
      # 98% of its scheduling periods without this and 9% with it. Traefik keys
      # on the real TCP peer, NOT on X-Forwarded-For — verified by re-running
      # the flood with a rotating header, which changed nothing.
      - "traefik.http.routers.bff.middlewares=default-ratelimit@file"
      - "traefik.http.services.bff.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # token-svc — Fastify v5.8.5 reservation-token service (T-1.0.1)
  # Owns auth_tokens.{guest, reservation, token_grant}. Issues opaque tokens,
  # exchanges them for HS256 JWTs, revokes by jti. Internal-only — the BFF
  # is the sole consumer. T-1.6.x may add Traefik for owner-side ops.
  # ─────────────────────────────────────────────────────────────────────────
  token-svc:
    build:
      context: ../..
      dockerfile: services/token-svc/Dockerfile
    image: daily-tour/token-svc:dev
    container_name: dt_token_svc
    restart: unless-stopped
    networks:
      - dt_internal
    environment:
      NODE_ENV: development
      PORT: "8088"
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: token-svc
      TOKEN_SVC_DATABASE_URL: postgres://token_svc:${SERVICE_DB_PASSWORD_TOKEN}@dt_postgres:5432/dailytour
      # MUST match the BFF's JWT_SIGNING_KEY — token-svc signs, BFF verifies.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY missing in .env}
      # Revoke publishes revoked JTIs here; the BFF reads them on every authed
      # request. Same instance and db index as the BFF — a split would make
      # revocation silently inert.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@dt_redis:6379/0
    healthcheck:
      # IPv4-pin per the T-0.4.3 lesson — BusyBox wget prefers IPv6 but the
      # Fastify listener binds 0.0.0.0 only.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8088/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # catalog-svc — Fastify v5.8.5 places/guesthouses/owner-profiles CRUD (T-1.1.1)
  # Owns catalog.{action, wish, guesthouse, owner_profile, place,
  # place_action_wish, place_media, place_candidate}. Internal-only — the BFF
  # aggregates on top. T-1.4.x (owner backoffice slice) may add an
  # Authentik-gated Traefik route for the owner-side write endpoints.
  # ─────────────────────────────────────────────────────────────────────────
  catalog-svc:
    build:
      context: ../..
      dockerfile: services/catalog-svc/Dockerfile
    image: daily-tour/catalog-svc:dev
    container_name: dt_catalog_svc
    restart: unless-stopped
    networks:
      - dt_internal
    environment:
      NODE_ENV: development
      PORT: "8081"
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: catalog-svc
      CATALOG_SVC_DATABASE_URL: postgres://catalog_svc:${SERVICE_DB_PASSWORD_CATALOG}@dt_postgres:5432/dailytour
      # Internal-token gate (dt-tests #36): the BFF is not the only container
      # on dt_internal, so catalog-svc verifies this on every non-health route.
      CATALOG_SVC_INTERNAL_TOKEN: ${CATALOG_SVC_INTERNAL_TOKEN:?CATALOG_SVC_INTERNAL_TOKEN missing in .env}
    healthcheck:
      # IPv4-pin per the T-0.4.3 lesson — BusyBox wget prefers IPv6 but
      # Fastify only listens on 0.0.0.0.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # media-svc — Fastify v5 pre-signed PUT/GET + asset registry (T-1.4.0)
  # Owns media.asset. Issues 15-min pre-signed MinIO URLs for direct client
  # uploads. Internal-only — the BFF is the sole caller in Phase 1.
  # Auth posture: X-Internal-Token stub until T-1.6.x wires Authentik OIDC.
  # ─────────────────────────────────────────────────────────────────────────
  media-svc:
    build:
      context: ../..
      dockerfile: services/media-svc/Dockerfile
    image: daily-tour/media-svc:dev
    container_name: dt_media_svc
    restart: unless-stopped
    networks:
      - dt_internal
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "8087"
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: media-svc
      MEDIA_SVC_DATABASE_URL: postgres://media_svc:${SERVICE_DB_PASSWORD_MEDIA}@dt_postgres:5432/dailytour
      # MinIO root creds used for dev; T-1.4.x follow-up can scope to a dedicated
      # media_svc IAM user via mc admin policy attach.
      # Use the compose service alias (no underscore) — MinIO rejects Host
      # headers containing underscores per RFC 952, so `dt_minio` fails even
      # with forcePathStyle. The `minio` alias is provided by docker compose.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dailytour}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env}
      MEDIA_SVC_INTERNAL_TOKEN: ${MEDIA_SVC_INTERNAL_TOKEN:?MEDIA_SVC_INTERNAL_TOKEN missing in .env}
      # T-1.4.1 transcode worker: AMQP URL for media.uploaded events.
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dailytour:${RABBITMQ_PASSWORD}@dt_rabbitmq:5672/}
    healthcheck:
      # IPv4-pin per the T-0.4.3 lesson — BusyBox wget prefers IPv6 but
      # Fastify only listens on 0.0.0.0.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8087/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # planner-svc — FastAPI + Anthropic SDK tour-plan service (T-3.0.0)
  # Skeleton on :8083; RAG retrieval (T-3.0.1), validators (T-3.0.2), and
  # async tour-plan endpoint (T-3.0.3) layer on top. Internal-only.
  # Owns the `planner` Postgres schema; reads catalog + search for RAG.
  # ─────────────────────────────────────────────────────────────────────────
  planner-svc:
    build:
      context: ../..
      dockerfile: services/planner-svc/Dockerfile
    image: daily-tour/planner-svc:dev
    container_name: dt_planner_svc
    restart: unless-stopped
    networks:
      - dt_internal
    environment:
      PORT: "8083"
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dt_otel_collector:4318
      OTEL_SERVICE_NAME: planner-svc
      DATABASE_URL: postgresql://planner_svc:${SERVICE_DB_PASSWORD_PLANNER}@dt_postgres:5432/dailytour
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dailytour:${RABBITMQ_PASSWORD}@dt_rabbitmq:5672/}
      SEARCH_SVC_URL: http://dt_search_svc:8082
      # Slice C: read-through cache for the IPMA weather forecast (rainy-slot
      # swap). Weather degrades gracefully if Redis is unavailable.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@dt_redis:6379/0
      OSRM_URL: ${OSRM_URL:-http://osrm-routed:5000}
      # Anthropic key — leave blank in dev/CI; the LLM client warns and
      # short-circuits to None rather than failing health checks (matches
      # search-svc's EMBEDDING_API_KEY posture).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      # Python 3.12-slim ships no wget/curl — exec python with a one-liner.
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8083/ready",timeout=2).status==200 else 1)''',
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # notif-svc — FastAPI email notification dispatcher (T-5.5.0)
  # Consumes POST /v1/notify/post-stay; dispatches review nudge emails via
  # SMTP. Triggered by the n8n post-stay-review workflow 2-3 days after token
  # expiry. Internal-only — n8n is the sole caller.
  # ─────────────────────────────────────────────────────────────────────────
  notif-svc:
    build:
      context: ../..
      dockerfile: services/notif-svc/Dockerfile
    image: daily-tour/notif-svc:dev
    container_name: dt_notif_svc
    restart: unless-stopped
    networks:
      - dt_internal
    environment:
      PORT: "8085"
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dt_otel_collector:4318
      OTEL_SERVICE_NAME: notif-svc
      SMTP_URL: ${SMTP_URL:-smtp://localhost:1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@daily-tour.example.local}
    healthcheck:
      # Python 3.12-slim ships no wget/curl — exec python with a one-liner.
      # Timeout is 15s (not 5s) because the CMD-SHELL spawns a fresh Python
      # interpreter on every probe; cold-start of the runtime regularly
      # exceeds 5s under the 0.25 CPU limit below, flagging the container
      # unhealthy even when /health responds 200 in milliseconds. Reproduced
      # 2026-05-23 (env-check blocked a UAT cycle on a phantom-unhealthy
      # notif-svc). 15s gives the interpreter generous headroom; widen
      # further if it flakes again.
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=2).status==200 else 1)''',
        ]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ─────────────────────────────────────────────────────────────────────────
  # search-svc — FastAPI + pgvector semantic search (T-2.0.0)
  # Owns search.place_embedding; exposes POST /v1/search/query. Consumed by
  # planner-svc for RAG retrieval. Internal-only.
  # ─────────────────────────────────────────────────────────────────────────
  search-svc:
    build:
      context: ../..
      dockerfile: services/search-svc/Dockerfile
    image: daily-tour/search-svc:dev
    container_name: dt_search_svc
    restart: unless-stopped
    networks:
      - dt_internal
    environment:
      PORT: "8082"
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dt_otel_collector:4318
      OTEL_SERVICE_NAME: search-svc
      DATABASE_URL: postgresql+asyncpg://search_svc:${SERVICE_DB_PASSWORD_SEARCH}@dt_postgres:5432/dailytour
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dailytour:${RABBITMQ_PASSWORD}@dt_rabbitmq:5672/}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8082/ready",timeout=2).status==200 else 1)''',
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # chat-hub — FastAPI WebSocket + driver abstraction (T-4.0.0)
  # Handles in-app, Telegram, and WhatsApp chat channels. Exposes WS at
  # /v1/chat/ws and webhook endpoints. Internal-only except for webhook
  # routes (Traefik-gated in staging/prod).
  # ─────────────────────────────────────────────────────────────────────────
  chat-hub:
    build:
      context: ../..
      dockerfile: services/chat-hub/Dockerfile
    image: daily-tour/chat-hub:dev
    container_name: dt_chat_hub
    restart: unless-stopped
    networks:
      - dt_internal
    environment:
      PORT: "8084"
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dt_otel_collector:4318
      OTEL_SERVICE_NAME: chat-hub
      # Persistence DB (T-4.0.1) — chat_svc owns the `chat` schema. Built from
      # SERVICE_DB_PASSWORD_CHAT so rotated envs (qual) authenticate; the dev
      # placeholder keeps dev byte-for-byte (config.py has the same default).
      DATABASE_URL: postgresql://chat_svc:${SERVICE_DB_PASSWORD_CHAT:-change-me-please-chat}@dt_postgres:5432/dailytour
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://dailytour:${RABBITMQ_PASSWORD}@dt_rabbitmq:5672/}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request,sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8084/ready",timeout=2).status==200 else 1)''',
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # PWA static — nginx serving the pre-built React 19 + Vite 6.4.2 bundle
  # (T-0.4.0 / T-0.4.1). Bind-mount over an image-baked dist for dev so a
  # rebuild + browser refresh is the inner loop (no docker rebuild). Phase 5
  # may switch to a built nginx image with the dist COPY'd in for QA / prod.
  # ─────────────────────────────────────────────────────────────────────────
  pwa-static:
    image: nginx:1.27-alpine
    container_name: dt_pwa_static
    restart: unless-stopped
    networks:
      - dt_internal
    volumes:
      - ../../apps/pwa/dist:/usr/share/nginx/html:ro
      - ../nginx/pwa.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Same IPv4-only quirk as the BFF: nginx's docker-entrypoint normally
      # appends `listen [::]:80;` to default.conf at startup, but our read-only
      # bind mount blocks that edit (see container logs: "can not modify ...
      # default.conf"). nginx ends up IPv4-only and BusyBox wget prefers IPv6,
      # so "localhost" → connection refused. Pin to 127.0.0.1.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pwa.rule=Host(`app.${TRAEFIK_DOMAIN_BASE:-dt.localhost}`)"
      - "traefik.http.routers.pwa.entrypoints=web"
      - "traefik.http.routers.pwa.service=pwa"
      - "traefik.http.services.pwa.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
