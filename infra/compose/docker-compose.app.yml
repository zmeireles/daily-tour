# Daily Tour — application overlay (BFF + token-svc + static PWA)
#
# Three services that round out the request path: PWA → Traefik → BFF →
# token-svc (+ Postgres + Redis on dt_internal from the base overlay).
#
#   - bff           → built locally from services/bff/Dockerfile (multi-stage,
#                     ~216 MB). Listens on :8080. Reached as http://api.${TRAEFIK_DOMAIN_BASE:-dt.localhost}
#                     via Traefik. CORS already echoes the request origin (see
#                     services/bff/src/app.ts), so app.${TRAEFIK_DOMAIN_BASE:-dt.localhost} → api.${TRAEFIK_DOMAIN_BASE:-dt.localhost}
#                     fetches work in the browser. Reaches token-svc directly via
#                     dt_internal (http://dt_token_svc:8088) — no Traefik leg.
#   - token-svc     → built from services/token-svc/Dockerfile (multi-stage,
#                     ~227 MB). Listens on :8088. **Internal-only** — no host
#                     port binding, no Traefik labels. The BFF is the only
#                     consumer in Phase 1; T-1.6.x may add Traefik for owner-side
#                     reservation CRUD.
#   - pwa-static    → nginx:1.27-alpine serving the pre-built apps/pwa/dist via
#                     a read-only bind mount. SPA fallback to index.html so the
#                     React router handles unknown routes. Reached as
#                     http://app.${TRAEFIK_DOMAIN_BASE:-dt.localhost} via Traefik. Run
#                     `pnpm --filter @daily-tour/pwa build` BEFORE bringing this
#                     overlay up — the bind mount has no inline build step.
#
# Compose on top of the base + Traefik (+ Authentik + n8n) overlays:
#   docker compose \
#     --env-file dev-environment \
#     -f infra/compose/docker-compose.base.yml \
#     -f infra/compose/docker-compose.traefik.yml \
#     -f infra/compose/docker-compose.authentik.yml \
#     -f infra/compose/docker-compose.n8n.yml \
#     -f infra/compose/docker-compose.app.yml \
#     up -d --build
#
# `--build` is required because the BFF service has a `build:` block and we
# want source changes picked up on `up`. For hot-reload feature work, prefer
# native `pnpm dev` (Vite + tsx watch) and skip this overlay — see
# infra/README.md "Dev flows".

name: dailytour-base

networks:
  dt_internal:
    external: true
    name: dt_internal

services:
  # ─────────────────────────────────────────────────────────────────────────
  # BFF — Fastify v5.8.5 backend-for-frontend (T-0.4.2)
  # Single ingress for the PWA. Built from the repo root because the
  # Dockerfile copies workspace files (pnpm-workspace.yaml, packages/*).
  # ─────────────────────────────────────────────────────────────────────────
  bff:
    build:
      context: ../..
      dockerfile: services/bff/Dockerfile
    image: daily-tour/bff:dev
    container_name: dt_bff
    restart: unless-stopped
    networks:
      - dt_internal
    depends_on:
      token-svc:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "8080"
      HOST: 0.0.0.0
      # OTel collector wiring lands in T-0.5.x / Phase 5 — leave the endpoint
      # empty so the SDK no-ops instead of crashing on connect refused.
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: bff
      # T-1.0.2 auth wiring: BFF calls token-svc and reads/writes the JTI
      # revocation cache in Redis.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY missing in .env}
      TOKEN_SVC_URL: http://dt_token_svc:8088
      REDIS_URL: redis://default:${REDIS_PASSWORD}@dt_redis:6379/0
    healthcheck:
      # node:22-alpine ships BusyBox wget at /usr/bin/wget; -q --spider works.
      # Use 127.0.0.1 explicitly — container /etc/hosts resolves "localhost" to
      # both 127.0.0.1 AND ::1, BusyBox wget prefers IPv6, and Fastify only
      # listens on 0.0.0.0 (IPv4). "localhost" → connection refused.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bff.rule=Host(`api.${TRAEFIK_DOMAIN_BASE:-dt.localhost}`)"
      - "traefik.http.routers.bff.entrypoints=web"
      - "traefik.http.routers.bff.service=bff"
      - "traefik.http.services.bff.loadbalancer.server.port=8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # token-svc — Fastify v5.8.5 reservation-token service (T-1.0.1)
  # Owns auth_tokens.{guest, reservation, token_grant}. Issues opaque tokens,
  # exchanges them for HS256 JWTs, revokes by jti. Internal-only — the BFF
  # is the sole consumer. T-1.6.x may add Traefik for owner-side ops.
  # ─────────────────────────────────────────────────────────────────────────
  token-svc:
    build:
      context: ../..
      dockerfile: services/token-svc/Dockerfile
    image: daily-tour/token-svc:dev
    container_name: dt_token_svc
    restart: unless-stopped
    networks:
      - dt_internal
    environment:
      NODE_ENV: development
      PORT: "8088"
      HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: token-svc
      TOKEN_SVC_DATABASE_URL: postgres://token_svc:${SERVICE_DB_PASSWORD_TOKEN}@dt_postgres:5432/dailytour
      # MUST match the BFF's JWT_SIGNING_KEY — token-svc signs, BFF verifies.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY missing in .env}
    healthcheck:
      # IPv4-pin per the T-0.4.3 lesson — BusyBox wget prefers IPv6 but the
      # Fastify listener binds 0.0.0.0 only.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8088/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # PWA static — nginx serving the pre-built React 19 + Vite 6.4.2 bundle
  # (T-0.4.0 / T-0.4.1). Bind-mount over an image-baked dist for dev so a
  # rebuild + browser refresh is the inner loop (no docker rebuild). Phase 5
  # may switch to a built nginx image with the dist COPY'd in for QA / prod.
  # ─────────────────────────────────────────────────────────────────────────
  pwa-static:
    image: nginx:1.27-alpine
    container_name: dt_pwa_static
    restart: unless-stopped
    networks:
      - dt_internal
    volumes:
      - ../../apps/pwa/dist:/usr/share/nginx/html:ro
      - ../nginx/pwa.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # Same IPv4-only quirk as the BFF: nginx's docker-entrypoint normally
      # appends `listen [::]:80;` to default.conf at startup, but our read-only
      # bind mount blocks that edit (see container logs: "can not modify ...
      # default.conf"). nginx ends up IPv4-only and BusyBox wget prefers IPv6,
      # so "localhost" → connection refused. Pin to 127.0.0.1.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pwa.rule=Host(`app.${TRAEFIK_DOMAIN_BASE:-dt.localhost}`)"
      - "traefik.http.routers.pwa.entrypoints=web"
      - "traefik.http.routers.pwa.service=pwa"
      - "traefik.http.services.pwa.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
