# Daily Tour — Compose base stack
#
# Postgres 17 + pgvector, Redis 7, RabbitMQ 4.3 (management), Garage + init.
# Traefik / Authentik / n8n / app services live in overlays (T-0.3.1+).
#
# Bring up: docker compose -f infra/compose/docker-compose.base.yml up -d
# See infra/README.md for the full operator runbook.

name: dailytour-base

networks:
  dt_internal:
    name: dt_internal
    driver: bridge

volumes:
  dt_postgres_data:
    name: dt_postgres_data
  dt_redis_data:
    name: dt_redis_data
  dt_rabbitmq_data:
    name: dt_rabbitmq_data
  dt_garage_meta:
    name: dt_garage_meta
  dt_garage_data:
    name: dt_garage_data

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Postgres 17 + pgvector + project-specific extensions/schemas/roles
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    build:
      context: ../postgres
      dockerfile: Dockerfile
    container_name: dt_postgres
    restart: unless-stopped
    networks:
      - dt_internal
    ports:
      - "127.0.0.1:${DT_HOST_PORT_POSTGRES:-27432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dailytour}
      # pt-PT collation is generated in Dockerfile; the en_US fallback is set
      # here in case the locale-gen fails on a given platform.
      LANG: en_US.UTF-8
    volumes:
      - dt_postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dailytour}"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"

  # ─────────────────────────────────────────────────────────────────────────
  # Redis 7 — session cache, WS fanout helper, rate-limit buckets
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: dt_redis
    restart: unless-stopped
    networks:
      - dt_internal
    ports:
      - "127.0.0.1:${DT_HOST_PORT_REDIS:-27379}:6379"
    command:
      - "redis-server"
      - "/usr/local/etc/redis/redis.conf"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD missing in .env}"
    volumes:
      - dt_redis_data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # RabbitMQ 4.3 with management UI + declarative definitions (exchanges, queues)
  # ─────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: dt_rabbitmq
    restart: unless-stopped
    networks:
      - dt_internal
    ports:
      - "127.0.0.1:${DT_HOST_PORT_RABBITMQ_AMQP:-27672}:5672"
      - "127.0.0.1:${DT_HOST_PORT_RABBITMQ_MGMT:-27673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dailytour}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD missing in .env}
    volumes:
      - dt_rabbitmq_data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ─────────────────────────────────────────────────────────────────────────
  # Garage — S3-compatible object storage (replaced MinIO, which no longer
  # publishes images: quay.io + Docker Hub refuse pulls). Single node, LMDB,
  # replication_factor=1. Config: infra/garage/garage.toml; its two secrets
  # arrive as env. The image is FROM scratch, so the healthcheck is the
  # exec-form binary, not a shell string.
  #
  # DNS: the service stays reachable as `minio` (network alias), so media-svc's
  # endpoint host and the presigned-URL host did not change; only the port did
  # (9000 -> 3900). The admin API (3903) and RPC (3901) are NOT published.
  # ─────────────────────────────────────────────────────────────────────────
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: dt_garage
    restart: unless-stopped
    networks:
      dt_internal:
        aliases:
          - minio
    ports:
      - "127.0.0.1:${DT_HOST_PORT_GARAGE_S3:-27902}:3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET missing in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN missing in .env}
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - dt_garage_meta:/var/lib/garage/meta
      - dt_garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # Garage one-shot bootstrap — layout, the S3 key (our existing
  # MINIO_ACCESS_KEY / MINIO_SECRET_KEY, imported unchanged) and the buckets.
  # Idempotent; runs every `up`. Runs in a pinned alpine and talks to Garage's
  # admin API because the garage image has no shell (rationale: init.sh).
  # ─────────────────────────────────────────────────────────────────────────
  garage-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: dt_garage_init
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - dt_internal
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN missing in .env}
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dailytour}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY missing in .env}
    volumes:
      - ../garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
