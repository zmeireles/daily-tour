# Daily Tour — Observability overlay (T-5.4.0; qual bridge T-3.A.1)
#
# Adds Prometheus + Grafana to the stack. Services push OTLP metrics to the
# otel-collector (in docker-compose.app.yml), which re-exposes them on :8889;
# Prometheus scrapes that single endpoint (dt_otel_collector:8889) over
# dt_internal. Grafana mounts the four dashboards and the Prometheus datasource
# as read-only config-maps.
#
# Port reservations (27xxx block, matching infra/README.md):
#   Prometheus → 127.0.0.1:${DT_HOST_PORT_PROMETHEUS:-27990}:9090
#   Grafana    → 127.0.0.1:${DT_HOST_PORT_GRAFANA:-27300}:3000
#
# Compose alongside the full app stack:
#   docker compose \
#     --env-file dev-environment \
#     -f infra/compose/docker-compose.base.yml \
#     -f infra/compose/docker-compose.traefik.yml \
#     -f infra/compose/docker-compose.app.yml \
#     -f infra/compose/overlay.observability.yml \
#     up -d --build
#
# Grafana default credentials: admin / admin (change on first login).
# Override via GF_SECURITY_ADMIN_PASSWORD in dev-environment.

name: dailytour-base

networks:
  dt_internal:
    external: true
    name: dt_internal

volumes:
  dt_prometheus_data:
    name: dt_prometheus_data
  dt_grafana_data:
    name: dt_grafana_data
  dt_alertmanager_data:
    name: dt_alertmanager_data

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus — metrics collector
  # Scrapes the otel-collector's Prometheus exporter (dt_otel_collector:8889)
  # on dt_internal. Retention trimmed to 7d for the RAM-tight 2-vCPU qual box.
  # Internal-only except for the loopback host-port binding for operator access.
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: dt_prometheus
    restart: unless-stopped
    networks:
      - dt_internal
    ports:
      - "127.0.0.1:${DT_HOST_PORT_PROMETHEUS:-27990}:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - dt_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # deploy.resources.limits is Swarm-only and IGNORED by plain `docker compose
    # up`; top-level mem_limit/cpus are the sole authority (same pattern as
    # overlay.qual.yml). Modest caps for the RAM-tight 2-vCPU/8GB qual box.
    deploy: !reset null
    mem_limit: 384m
    cpus: 0.5

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana — dashboard UI
  # Loads four pre-built dashboards and the Prometheus datasource from the
  # infra/observability/ config-map mounts. Persists user changes in the
  # dt_grafana_data volume.
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.0.0
    container_name: dt_grafana
    restart: unless-stopped
    networks:
      - dt_internal
    ports:
      - "127.0.0.1:${DT_HOST_PORT_GRAFANA:-27300}:3000"
    volumes:
      - dt_grafana_data:/var/lib/grafana
      - ../observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/bff-latency.json
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy: !reset null
    mem_limit: 256m
    cpus: 0.5

  # ─────────────────────────────────────────────────────────────────────────
  # Blackbox-exporter — uptime probing
  # Prometheus's `blackbox` / `blackbox_live` jobs hit /probe here, passing the
  # real target URL. Modules live in ../observability/blackbox.yml. Internal
  # only (no host port) — operator access is via Prometheus.
  # ─────────────────────────────────────────────────────────────────────────
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: dt_blackbox_exporter
    restart: unless-stopped
    networks:
      - dt_internal
    volumes:
      - ../observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9115/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy: !reset null
    mem_limit: 48m
    cpus: 0.25

  # ─────────────────────────────────────────────────────────────────────────
  # Alertmanager — alert routing → Telegram
  # Mounts the deploy-rendered alertmanager.yml (gitignored; rendered from
  # alertmanager.yml.tmpl by deploy-qa.yml with the ALERT_TELEGRAM_* secrets).
  # Loopback host-port for operator access / debugging.
  # ─────────────────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: dt_alertmanager
    restart: unless-stopped
    networks:
      - dt_internal
    ports:
      - "127.0.0.1:27993:9093"
    volumes:
      - ../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - dt_alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy: !reset null
    mem_limit: 64m
    cpus: 0.25
