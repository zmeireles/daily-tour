# Daily Tour — Observability overlay (T-5.4.0)
#
# Adds Prometheus + Grafana to the stack. Prometheus scrapes /metrics from all
# seven application services on dt_internal. Grafana mounts the four dashboards
# and the Prometheus datasource as read-only config-maps.
#
# Port reservations (27xxx block, matching infra/README.md):
#   Prometheus → 127.0.0.1:${DT_HOST_PORT_PROMETHEUS:-27990}:9090
#   Grafana    → 127.0.0.1:${DT_HOST_PORT_GRAFANA:-27300}:3000
#
# Compose alongside the full app stack:
#   docker compose \
#     --env-file dev-environment \
#     -f infra/compose/docker-compose.base.yml \
#     -f infra/compose/docker-compose.traefik.yml \
#     -f infra/compose/docker-compose.app.yml \
#     -f infra/compose/overlay.observability.yml \
#     up -d --build
#
# Grafana default credentials: admin / admin (change on first login).
# Override via GF_SECURITY_ADMIN_PASSWORD in dev-environment.

name: dailytour-base

networks:
  dt_internal:
    external: true
    name: dt_internal

volumes:
  dt_prometheus_data:
    name: dt_prometheus_data
  dt_grafana_data:
    name: dt_grafana_data

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus — metrics collector
  # Scrapes all seven application services on dt_internal via /metrics.
  # Retention defaults to 15d (Prometheus default). Internal-only except for
  # the host-port binding for operator access.
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: dt_prometheus
    restart: unless-stopped
    networks:
      - dt_internal
    ports:
      - "127.0.0.1:${DT_HOST_PORT_PROMETHEUS:-27990}:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - dt_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana — dashboard UI
  # Loads four pre-built dashboards and the Prometheus datasource from the
  # infra/observability/ config-map mounts. Persists user changes in the
  # dt_grafana_data volume.
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.0.0
    container_name: dt_grafana
    restart: unless-stopped
    networks:
      - dt_internal
    ports:
      - "127.0.0.1:${DT_HOST_PORT_GRAFANA:-27300}:3000"
    volumes:
      - dt_grafana_data:/var/lib/grafana
      - ../observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/bff-latency.json
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
