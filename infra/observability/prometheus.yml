# Prometheus scrape configuration — Daily Tour (T-3.A.1)
#
# The 8 application services do NOT expose /metrics. They push OTLP metrics to
# the otel-collector (dt_otel_collector), which re-exposes them in Prometheus
# exposition format on :8889. Prometheus scrapes that single endpoint over
# dt_internal; per-service identity is carried by the `service` label
# (resource_to_telemetry_conversion promotes service.name → label).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: daily-tour
    env: qual

# Route firing alerts to Alertmanager (dt_alertmanager:9093) over dt_internal.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["dt_alertmanager:9093"]

# Uptime + error-rate alert rules (T-3.A.2). Mounted read-only by the overlay.
rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  # The OTLP→Prometheus bridge — all 8 services' metrics arrive here.
  - job_name: otel-collector
    static_configs:
      - targets: ["dt_otel_collector:8889"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus self-scrape (process + scrape health).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Blackbox uptime probes — 2xx liveness. Prometheus hits /probe on the
  # blackbox-exporter, passing the real target via the standard relabel dance:
  # the static target becomes ?target=, instance gets the human-readable URL,
  # and __address__ is rewritten to the exporter itself.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.qual.stay.portugalodyssey.pt/health
          - https://qual.stay.portugalodyssey.pt/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dt_blackbox_exporter:9115

  # Blackbox liveness probe where 401 counts as alive (BFF /v1/auth/refresh).
  - job_name: blackbox_live
    metrics_path: /probe
    params:
      module: [http_live]
    static_configs:
      - targets:
          - https://qual.stay.portugalodyssey.pt/v1/auth/refresh
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: dt_blackbox_exporter:9115
