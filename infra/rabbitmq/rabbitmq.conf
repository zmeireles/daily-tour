# RabbitMQ 4.3 — Daily Tour broker config.
#
# Topology (exchanges, queues, bindings) is declared in definitions.json and
# loaded at boot via the line below — keeps the broker stateless w.r.t. routing
# config; producers/consumers can assume the exchanges + queues exist.

load_definitions = /etc/rabbitmq/definitions.json

# AMQP listener — internal network only (Docker exposes 5672 to 127.0.0.1).
listeners.tcp.default = 5672

# Management plugin (UI + REST) on its conventional port.
management.tcp.port = 15672

# Disable the guest account from outside localhost — env-defined dailytour user
# is the only credential the app stack should use.
loopback_users.guest = true
