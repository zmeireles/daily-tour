# Daily Tour — Redis configuration
# Dev defaults. Production retuning lands in Phase 5 (T-5.4.x observability + sizing).

# --- Network ---
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 60

# --- Auth (password sourced from REDIS_PASSWORD via Compose command override) ---
# We deliberately do NOT bake the password into this file so it can be
# checked in. The Compose service passes --requirepass on argv.

# --- Persistence ---
# AOF gives durability for queued chat messages and tour-plan status while we
# don't yet have replication. fsync every second is the sweet spot.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Memory ---
maxmemory 256mb
maxmemory-policy allkeys-lru
