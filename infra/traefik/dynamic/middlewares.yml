http:
  middlewares:
    # ─────────────────────────────────────────────────────────────────────────
    # Dashboard basic-auth — reads from htpasswd file (mounted read-only).
    # Regenerate with: htpasswd -nbB admin "<new>" → update dashboard-users
    # and TRAEFIK_DASHBOARD_PASSWORD in .env.
    # ─────────────────────────────────────────────────────────────────────────
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/dashboard-users

    # ─────────────────────────────────────────────────────────────────────────
    # Default rate-limit — sane dev default; tune in Phase 5 (T-5.4.x).
    # ─────────────────────────────────────────────────────────────────────────
    default-ratelimit:
      rateLimit:
        average: 100
        burst: 200

    # ─────────────────────────────────────────────────────────────────────────
    # Gzip compression — applied at the Traefik layer.
    # ─────────────────────────────────────────────────────────────────────────
    gzip:
      compress: {}

    # ─────────────────────────────────────────────────────────────────────────
    # Authentik forward-auth — STUB; wired in T-0.3.2.
    # The middleware name is defined here so services in later tasks can
    # reference authentik-forward-auth@file without editing this file again.
    # The actual forwardAuth address (http://dt_authentik:9000/outpost.goauthentik.io/...)
    # is set when the Authentik service is healthy (T-0.3.2).
    # ─────────────────────────────────────────────────────────────────────────
    # authentik-forward-auth:
    #   forwardAuth:
    #     address: "http://dt_authentik:9000/outpost.goauthentik.io/auth/traefik"
    #     trustForwardHeader: true
    #     authResponseHeaders:
    #       - X-authentik-username
    #       - X-authentik-groups
    #       - X-authentik-email
    #       - X-authentik-name
    #       - X-authentik-uid
    #       - X-authentik-jwt
    #       - X-authentik-meta-jwks
    #       - X-authentik-meta-outpost
    #       - X-authentik-meta-provider
    #       - X-authentik-meta-app
    #       - X-authentik-meta-version
