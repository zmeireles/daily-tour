http:
  middlewares:
    # ─────────────────────────────────────────────────────────────────────────
    # Dashboard basic-auth — reads from htpasswd file (mounted read-only).
    # Regenerate with: htpasswd -nbB admin "<new>" → update dashboard-users
    # and TRAEFIK_DASHBOARD_PASSWORD in .env.
    # ─────────────────────────────────────────────────────────────────────────
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/dashboard-users

    # ─────────────────────────────────────────────────────────────────────────
    # Default rate-limit — sane dev default; tune in Phase 5 (T-5.4.x).
    # ─────────────────────────────────────────────────────────────────────────
    default-ratelimit:
      rateLimit:
        average: 100
        burst: 200

    # ─────────────────────────────────────────────────────────────────────────
    # Gzip compression — applied at the Traefik layer.
    # ─────────────────────────────────────────────────────────────────────────
    gzip:
      compress: {}

    # ─────────────────────────────────────────────────────────────────────────
    # Authentik forward-auth — DEFINED BUT NOT YET WIRED.
    #
    # The Authentik server is up (T-0.3.2) but the embedded outpost's
    # /outpost.goauthentik.io/auth/traefik endpoint currently returns 404 —
    # the outpost needs a Proxy Provider binding before it answers forward-auth
    # requests. That wiring belongs to the first task that actually needs to
    # protect a service through Traefik: either T-0.3.3 (n8n) or T-1.6.x
    # (owner backoffice through PWA). Both will:
    #   1. Create a Proxy Provider in Authentik (via API or UI).
    #   2. Bind it to the embedded `authentik Embedded Outpost`.
    #   3. Uncomment the block below + add the middleware label on the target service.
    #
    # authentik-forward-auth:
    #   forwardAuth:
    #     address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
    #     trustForwardHeader: true
    #     authResponseHeaders:
    #       - X-authentik-username
    #       - X-authentik-groups
    #       - X-authentik-email
    #       - X-authentik-name
    #       - X-authentik-uid
    #       - X-authentik-jwt
    #       - X-authentik-meta-jwks
    #       - X-authentik-meta-outpost
    #       - X-authentik-meta-provider
    #       - X-authentik-meta-app
    #       - X-authentik-meta-version
