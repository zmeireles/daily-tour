http:
  middlewares:
    # ─────────────────────────────────────────────────────────────────────────
    # Dashboard basic-auth — reads from htpasswd file (mounted read-only).
    # Regenerate with: htpasswd -nbB admin "<new>" → update dashboard-users
    # and TRAEFIK_DASHBOARD_PASSWORD in .env.
    # ─────────────────────────────────────────────────────────────────────────
    dashboard-auth:
      basicAuth:
        usersFile: /etc/traefik/dashboard-users

    # ─────────────────────────────────────────────────────────────────────────
    # Default rate-limit — sane dev default; tune in Phase 5 (T-5.4.x).
    # ─────────────────────────────────────────────────────────────────────────
    default-ratelimit:
      rateLimit:
        average: 100
        burst: 200

    # ─────────────────────────────────────────────────────────────────────────
    # Gzip compression — applied at the Traefik layer.
    # ─────────────────────────────────────────────────────────────────────────
    gzip:
      compress: {}

    # ─────────────────────────────────────────────────────────────────────────
    # Authentik forward-auth — active as of T-0.3.2.
    # Downstream services opt in with:
    #   traefik.http.routers.<name>.middlewares=authentik-forward-auth@file
    # First user: n8n in T-0.3.3; owner backoffice in T-1.6.1.
    # Returns 200 for authenticated requests; 302 to Authentik login for others.
    # ─────────────────────────────────────────────────────────────────────────
    authentik-forward-auth:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
