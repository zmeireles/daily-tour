# Traefik v3 — static configuration
# Dynamic config (middlewares, routers) is hot-reloaded from /etc/traefik/dynamic/*.yml

# ─────────────────────────────────────────────────────────────────────────────
# Entrypoints
#
# Dev/QA runs on plain HTTP — the websecure entrypoint has no TLS
# certificate configured (ACME staging requires a real public domain to
# issue). Phase 5 hardening (T-5.x) re-introduces the web→websecure
# redirect once a real domain + cert resolver is in place.
# ─────────────────────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

# ─────────────────────────────────────────────────────────────────────────────
# Providers
# ─────────────────────────────────────────────────────────────────────────────
providers:
  docker:
    network: dt_internal
    exposedByDefault: false   # services must opt-in via traefik.enable=true label
  file:
    directory: /etc/traefik/dynamic
    watch: true               # hot-reload on file change

# ─────────────────────────────────────────────────────────────────────────────
# API / Dashboard
# ─────────────────────────────────────────────────────────────────────────────
api:
  dashboard: true
  insecure: false             # dashboard is routed behind dashboard-auth middleware

# Ping handler is required for the container healthcheck (`traefik healthcheck`).
# When `ping: {}` is omitted, the binary exits with
# "please enable `ping` to use health check" and the container flips to unhealthy.
ping: {}

# ─────────────────────────────────────────────────────────────────────────────
# Certificate resolvers (plan-007 Q.2.2)
#
# Two HTTP-01 resolvers: `letsencrypt-staging` (untrusted certs, no rate limit —
# verify routing on first qual boot) and `letsencrypt` (production). The qual
# overlay's routers use `letsencrypt`; the Q.3.2 runbook brings the stack up on
# staging first, then flips to production once routing/redirects are confirmed.
#
# The ACME `email` is INTENTIONALLY absent here: Traefik does NOT interpolate
# ${ENV} in this static file (the old `email: "${TRAEFIK_ACME_EMAIL}"` was sent
# to LE verbatim — bug). It is supplied per-resolver via CLI flags on the
# Traefik `command:` in overlay.qual.yml, where Compose DOES interpolate
# ${TRAEFIK_ACME_EMAIL} from .env.qual. Flags merge with this file's structure.
# ─────────────────────────────────────────────────────────────────────────────
certificatesResolvers:
  letsencrypt-staging:
    acme:
      storage: /acme/acme.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web
  letsencrypt:
    acme:
      storage: /acme/acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
log:
  level: INFO

accessLog:
  format: json              # Loki picks this up in Phase 5 (T-5.4.x)
