# Traefik v3 — static configuration
# Dynamic config (middlewares, routers) is hot-reloaded from /etc/traefik/dynamic/*.yml

# ─────────────────────────────────────────────────────────────────────────────
# Entrypoints
# ─────────────────────────────────────────────────────────────────────────────
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: false   # 302 during dev; flip to true in Phase 5
  websecure:
    address: ":443"

# ─────────────────────────────────────────────────────────────────────────────
# Providers
# ─────────────────────────────────────────────────────────────────────────────
providers:
  docker:
    network: dt_internal
    exposedByDefault: false   # services must opt-in via traefik.enable=true label
  file:
    directory: /etc/traefik/dynamic
    watch: true               # hot-reload on file change

# ─────────────────────────────────────────────────────────────────────────────
# API / Dashboard
# ─────────────────────────────────────────────────────────────────────────────
api:
  dashboard: true
  insecure: false             # dashboard is routed behind dashboard-auth middleware

# ─────────────────────────────────────────────────────────────────────────────
# Certificate resolvers — LE staging only in dev/QA
# Switch to letsencrypt (live) in Phase 5 with a real public domain.
# ─────────────────────────────────────────────────────────────────────────────
certificatesResolvers:
  letsencrypt-staging:
    acme:
      email: "${TRAEFIK_ACME_EMAIL}"
      storage: /acme/acme.json
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: web

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
log:
  level: INFO

accessLog:
  format: json              # Loki picks this up in Phase 5 (T-5.4.x)
