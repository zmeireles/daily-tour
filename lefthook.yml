# lefthook.yml — Git hook manager for Daily Tour monorepo
#
# INSTALL GITLEAKS (required for secret scanning):
#   Linux (apt):  sudo apt install gitleaks
#   macOS:        brew install gitleaks
#   Manual:       https://github.com/gitleaks/gitleaks/releases (grab the binary for your OS)
#
# HOOKS AUTO-INSTALL:
#   pnpm install  →  runs `prepare` script  →  runs `lefthook install`
#   You can also run: pnpm exec lefthook install
#
# LOCAL OVERRIDES (opt-out without editing this file):
#   cp .lefthook-local.example.yml .lefthook-local.yml
#   Edit .lefthook-local.yml to skip individual commands (it is gitignored).

pre-commit:
  parallel: true
  commands:
    gitleaks-staged:
      # Soft-skip if gitleaks is not on PATH — CI (T-0.1.4) is the hard gate.
      # Install gitleaks first (see top of this file).
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "[lefthook] WARNING: gitleaks not found on PATH — skipping secret scan."
          echo "[lefthook] Install gitleaks to enable local secret scanning (see lefthook.yml header)."
          exit 0
        fi
        # The SAME config CI resolves. It used to be `.gitleaks-ext.toml`, which
        # chains to a machine-local central config no runner can read — so a
        # local pass predicted nothing about CI, and CI in fact ran with no
        # config at all (#415).
        gitleaks protect --staged --redact -v --config .gitleaks.toml
      fail_text: |
        Secret scan failed. If gitleaks is not installed, install it (see lefthook.yml header).
        If a real secret was detected, remove it from the staged files before committing.

    gitleaks-central-in-sync:
      # `.gitleaks/central.toml` is a VERBATIM copy of the platform SoT config,
      # vendored because CI cannot read an absolute home path (#415). A central
      # update that never reaches this repo would otherwise sit unnoticed — and
      # silently, which is the failure mode that cost five weeks. Skips where the
      # central original is absent (i.e. CI, which only needs the vendored copy).
      run: |
        CENTRAL="${GITLEAKS_CENTRAL_CONFIG:-$HOME/.claude/config/gitleaks.toml}"
        if [ ! -f "$CENTRAL" ]; then
          echo "[lefthook] central gitleaks config not on this machine — skipping drift check."
          exit 0
        fi
        if [ ! -f .gitleaks/central.toml ]; then
          echo "[lefthook] ✗ .gitleaks/central.toml is MISSING. CI resolves the ruleset" >&2
          echo "  through it; without it the scan falls back to bare defaults (#415)." >&2
          echo "  Fix (then re-stage):  cp \"$CENTRAL\" .gitleaks/central.toml" >&2
          exit 1
        fi
        if ! cmp -s "$CENTRAL" .gitleaks/central.toml; then
          echo "[lefthook] ✗ .gitleaks/central.toml has DRIFTED from the platform SoT config." >&2
          diff -u .gitleaks/central.toml "$CENTRAL" | head -30 >&2
          echo "  Sync it (then re-stage):  cp \"$CENTRAL\" .gitleaks/central.toml" >&2
          exit 1
        fi
      fail_text: "Sync .gitleaks/central.toml with the platform SoT config and re-stage it."

    uat-specs-not-in-temp:
      # Specs belong in the tracked e2e/; temp/ is gitignored and disposable.
      # Six UAT specs were lost on 2026-08-15 because they lived only in temp/
      # and had never been `git add`ed. The convention had been written into
      # four consecutive handoffs and still failed, so this is the mechanical
      # version. See scripts/dev/check-uat-specs.sh and e2e/README.md.
      run: bash scripts/dev/check-uat-specs.sh
      fail_text: "Move the UAT spec(s) out of temp/ and into e2e/ — see the paths printed above."

    prettier-staged:
      # Source nvm so non-interactive hook shells pick up the .nvmrc-pinned Node.
      # Falls through gracefully if nvm isn't installed (engine-strict will then
      # catch a wrong Node loudly, which is the right behaviour).
      run: |
        [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" && nvm use --silent >/dev/null 2>&1
        pnpm exec prettier --check --ignore-unknown {staged_files}
      fail_text: "Run `pnpm exec prettier --write {staged_files}` to fix formatting."

    lint-affected:
      # Lint via turbo's affected graph (same command CI runs in ci.yml).
      # Each package owns its own eslint.config.js; turbo discovers them.
      # If no package is "affected" (e.g. only docs changed) turbo exits 0.
      # Aligns this local hook with the CI quality job.
      run: |
        [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" && nvm use --silent >/dev/null 2>&1
        pnpm exec turbo run lint --filter=...[HEAD]
      fail_text: "Fix ESLint errors in the affected package(s) before committing."

commit-msg:
  commands:
    conventional-commit:
      # Validates Conventional Commits format:
      #   <type>[optional scope]: <description>
      # Allowed types: feat|fix|chore|docs|refactor|test|perf|build|ci|style|revert
      #
      # Skips:
      #   - Merge commits (message starts with "Merge ")
      #   - cs-agent auto-commit fallback ("feat: agent work on ...")
      run: |
        msg=$(cat {1})
        # Skip merge commits
        echo "$msg" | grep -qE "^Merge " && exit 0
        # Skip cs-agent auto-commit fallback
        echo "$msg" | grep -qE "^feat: agent work on " && exit 0
        # Step 1: validate the type(scope): prefix structure.
        first_line=$(echo "$msg" | head -1)
        if ! echo "$first_line" | grep -qE "^(feat|fix|chore|docs|refactor|test|perf|build|ci|style|revert)(\([^)]+\))?: .+"; then
          echo "[lefthook] ERROR: Commit message does not follow Conventional Commits format."
          echo "[lefthook] Expected: <type>[optional scope]: <description>"
          echo "[lefthook] Example:  feat(auth): add token validation"
          echo "[lefthook] Allowed types: feat|fix|chore|docs|refactor|test|perf|build|ci|style|revert"
          exit 1
        fi
        # Step 2: enforce subject (description after the colon) starts lowercase —
        # matches the pr-title.yml workflow's `subjectPattern: ^(?![A-Z]).+$` rule
        # so we catch the issue locally instead of on the PR check.
        subject=$(echo "$first_line" | sed -E 's/^[a-z]+(\([^)]+\))?: //')
        if echo "$subject" | grep -qE "^[A-Z]"; then
          echo "[lefthook] ERROR: Commit subject must start with a lowercase character."
          echo "[lefthook] Got:      $subject"
          echo "[lefthook] Example:  add Node OpenTelemetry SDK helper   (not 'Add Node ...')"
          echo "[lefthook] Matches pr-title.yml subjectPattern ^(?![A-Z]).+$"
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    typecheck:
      run: |
        [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" && nvm use --silent >/dev/null 2>&1
        pnpm typecheck
      fail_text: "Fix TypeScript errors before pushing. Ensure your shell uses Node from .nvmrc (run `nvm use`)."

    audit:
      # Mirror the CI security workflow's pnpm-audit job so we catch HIGH+ CVEs
      # locally before they fail the PR. The CI gate stays — this is
      # belt-and-braces. Runs in parallel with typecheck for speed.
      #
      # Both graphs, prod first: when the pair fails you want to know
      # immediately whether production is affected. Three newly-published
      # advisories blocked pushes in a single session (brace-expansion,
      # fast-uri, nanoid), so this fires more often than you would expect —
      # that is the gate working, not the gate misbehaving.
      # `|| exit 1` is load-bearing: a lefthook run-block has no `set -e`, so the
      # block's exit code is the LAST command's only. Without it the prod line's
      # failure is silently discarded and the verdict rides entirely on the full
      # audit — which happens to be correct today (full ⊇ prod) but is correct by
      # accident, and stops being correct the moment anyone reorders these lines.
      # `set -e` is not an option here: it would abort on the nvm guard.
      run: |
        [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" && nvm use --silent >/dev/null 2>&1
        pnpm audit --prod --audit-level=high || exit 1
        pnpm audit --audit-level=high || exit 1
      fail_text: "HIGH+ vulnerability in dependencies. The PROD line runs first — if it passed and this still failed, the advisory is dev-only and production is unaffected. See https://github.com/advisories and bump the affected package, or add a closed-range pnpm override."

    tests:
      # CI runs `turbo run test --filter=...[origin/main]`. Mirror that here so
      # we catch failing tests before the runner does.
      #
      # The base MUST be origin/main, not HEAD. This is pre-push: the commit
      # already exists and the tree is clean, so `...[HEAD]` diffs HEAD against
      # itself and selects nothing — measured: 0 packages / 0 tasks, against
      # 10 tasks across 7 packages for `...[origin/main]` on the same tree. It
      # ran green on every push for months by selecting no tests at all.
      # Contrast pre-commit's lint gate, where `...[HEAD]` IS right: there the
      # changes are staged rather than committed, so HEAD is the previous
      # commit and the diff is real.
      run: |
        [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" && nvm use --silent >/dev/null 2>&1
        pnpm exec turbo run test --filter=...[origin/main]
      fail_text: "Fix failing tests in the affected package(s) before pushing."
