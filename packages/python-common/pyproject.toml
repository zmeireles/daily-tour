[project]
name = "daily-tour-common"
version = "0.1.0"
description = "Shared FastAPI base, Pydantic v2 models, and OTel bootstrap for Daily Tour Python services"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.136,<0.137",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
  "structlog>=25.1,<26",
  "opentelemetry-api>=1.33,<2",
  "opentelemetry-sdk>=1.33,<2",
  "opentelemetry-instrumentation-fastapi>=0.54b0",
  "opentelemetry-instrumentation-asgi>=0.54b0",
  "opentelemetry-instrumentation-httpx>=0.54b0",
  "opentelemetry-instrumentation-asyncpg>=0.54b0",
  "opentelemetry-instrumentation-aio-pika>=0.54b0",
  "opentelemetry-exporter-otlp-proto-http>=1.33,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pytest-cov>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_tour_common"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
