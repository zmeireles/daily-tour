[project]
name = "chat-hub"
version = "0.1.0"
description = "Daily Tour chat hub — FastAPI WebSocket + driver abstraction for in-app/Telegram/WhatsApp"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "daily-tour-common",
  "fastapi>=0.136,<0.137",
  "uvicorn[standard]>=0.34,<1",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "structlog>=25.1,<26",
  "httpx>=0.28,<1",
  "websockets>=13.1,<14",
  "aiogram>=3.7,<4",
  "anthropic>=0.40,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pytest-cov>=6.0,<7",
]

[tool.uv.sources]
daily-tour-common = { path = "../../packages/python-common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["daily_tour_common.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
